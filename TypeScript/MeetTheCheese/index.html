<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meet The Cheese — Menu &amp; WhatsApp Ordering | Ajman · Al Zubair · Kalba</title>
    <meta
      name="description"
      content="Browse the Meet The Cheese menu — zinger and smash burgers, toast sandwiches, combo meals, loaded fries, shakes and mojitos — choose your branch in Ajman, Al Zubair or Kalba, and send your order on WhatsApp."
    />
    <meta name="theme-color" content="#0a111d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/images/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/brand/hero-burger.jpg" />

    <!-- Social sharing. Absolute URLs + canonical are added at build time when SITE_URL is set (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meet The Cheese" />
    <meta property="og:title" content="Meet The Cheese — Menu &amp; WhatsApp Ordering" />
    <meta
      property="og:description"
      content="Burgers, sandwiches, combos, fries and shakes. Choose your branch — Ajman, Al Zubair or Kalba — build your order and send it on WhatsApp."
    />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meet The Cheese logo next to a stacked cheeseburger" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:locale:alternate" content="ar_AE" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--%SEO_ABSOLUTE%-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; color: #f7f1e3; background: #0a111d; padding: 24px">
        Meet The Cheese — please enable JavaScript to view the menu.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
